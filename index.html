<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTS Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111;
      --surface: #1c1c1e;
      --surface2: #2c2c2e;
      --border: #3a3a3c;
      --accent: #0a84ff;
      --accent-hover: #409cff;
      --text: #f5f5f7;
      --text-muted: #8e8e93;
      --red: #ff453a;
      --sidebar: 280px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      height: 100vh;
      overflow: hidden;
    }

    /* Login */
    #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
    #login-screen.hidden { display: none; }
    .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; width: 320px; display: flex; flex-direction: column; gap: 16px; text-align: center; }
    .login-box h2 { font-size: 20px; font-weight: 600; }
    .login-box p { font-size: 13px; color: var(--text-muted); }
    .login-error { font-size: 12px; color: var(--red); min-height: 16px; }

    /* Layout */
    #app { display: none; height: 100vh; }
    #app.visible { display: flex; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .sidebar-header {
      padding: 20px 16px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .sidebar-header span {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .library-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }

    .library-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    .library-item:last-child { border-bottom: none; }
    .library-item:hover { background: var(--surface2); }
    .library-item.active { background: #1a2a3a; }

    .lib-info { flex: 1; min-width: 0; }
    .lib-title { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
    .lib-date { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    .lib-play { font-size: 14px; color: var(--text-muted); flex-shrink: 0; }
    .library-item.active .lib-play { color: var(--accent); }
    .lib-progress { height: 2px; background: var(--border); border-radius: 1px; margin-top: 5px; overflow: hidden; }
    .lib-progress > div { height: 100%; background: var(--accent); }
    .library-item.done .lib-title, .library-item.done .lib-date { opacity: 0.5; }
    .lib-archive { background: none; border: 1px solid var(--border); color: var(--text-muted); border-radius: 6px; padding: 3px 7px; font-size: 10px; font-family: inherit; cursor: pointer; flex-shrink: 0; }
    .lib-archive:hover { color: var(--text); border-color: var(--text-muted); }
    .library-section { padding: 10px 16px; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; border-bottom: 1px solid var(--border); background: var(--bg); user-select: none; }
    .library-empty { padding: 24px 16px; text-align: center; color: var(--text-muted); font-size: 12px; }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 24px;
      overflow-y: auto;
    }

    .main-inner { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; }

    .header { display: flex; align-items: center; justify-content: space-between; }
    h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }

    /* Card */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .card-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Inputs */
    input[type="password"] { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.15s; }
    input[type="password"]:focus { border-color: var(--accent); }
    input[type="file"] { display: none; }
    input[type="range"] { flex: 1; -webkit-appearance: none; height: 4px; border-radius: 2px; background: var(--border); outline: none; cursor: pointer; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; }

    /* Buttons */
    .btn { border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--text-muted); }
    .btn-ghost { background: none; border: 1px solid var(--border); color: var(--text-muted); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 11px; font-family: inherit; transition: all 0.15s; }
    .btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }

    /* File open */
    .file-open-area { display: flex; align-items: center; gap: 10px; }
    #file-name { flex: 1; color: var(--text-muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Player */
    .player-hidden { display: none; }
    .waveform-bar { display: flex; align-items: center; gap: 10px; }
    .time { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; min-width: 38px; }
    .time.end { text-align: right; }
    .controls { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .btn-icon { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; height: 36px; padding: 0 10px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; flex-shrink: 0; transition: all 0.15s; cursor: pointer; white-space: nowrap; gap: 3px; }
    .btn-icon:hover { border-color: var(--text-muted); }
    .btn-icon .icon { font-size: 13px; }
    .btn-icon.play-pause { background: var(--accent); border-color: var(--accent); border-radius: 50%; width: 52px; height: 52px; padding: 0; font-size: 20px; }
    .btn-icon.play-pause:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .speed-row { display: flex; align-items: center; gap: 8px; }
    .speed-label { font-size: 12px; color: var(--text-muted); min-width: 42px; }
    .speed-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .speed-pill { background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
    .speed-pill:hover { color: var(--text); border-color: var(--text-muted); }
    .speed-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .volume-row { display: flex; align-items: center; gap: 8px; }
    .volume-icon { font-size: 16px; color: var(--text-muted); }
    .bottom-row { display: flex; align-items: center; justify-content: flex-end; }
    .track-author { font-size: 13px; color: var(--text); margin-top: -8px; }
    .track-source { font-size: 12px; color: var(--accent); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -8px; }
    .track-source:hover { text-decoration: underline; }
    .play-hint { text-align: center; color: var(--accent); font-size: 12px; }
    .no-audio-msg { text-align: center; color: var(--text-muted); font-size: 13px; padding: 8px 0; }

    /* Shortcuts */
    .shortcuts { display: flex; gap: 16px; flex-wrap: wrap; }
    .shortcut { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }
    kbd { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; font-size: 10px; font-family: inherit; }

    /* Mobile */
    @media (max-width: 600px) {
      body { overflow: auto; }
      #app.visible { flex-direction: column; height: auto; }
      .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
      .library-list { max-height: none; }
      .main { padding: 20px 16px; order: -1; width: 100%; min-width: 0; align-items: stretch; }
      .main-inner, .card { min-width: 0; }
      input[type="range"] { min-width: 0; width: 100%; }
      .btn-icon { padding: 0 8px; }
      .shortcuts { display: none; }
    }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h2>TTS Player</h2>
    <p>Enter password to continue</p>
    <input type="password" id="login-input" placeholder="Password" autocomplete="current-password">
    <p class="login-error" id="login-error"></p>
    <button class="btn btn-primary" id="login-btn">Unlock</button>
  </div>
</div>

<div id="app">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span>Library</span>
      <button class="btn-ghost" id="library-refresh-btn">Refresh</button>
    </div>
    <ul class="library-list" id="library-list"></ul>
  </div>

  <!-- Main -->
  <div class="main">
  <div class="main-inner">

    <div class="header">
      <h1>TTS Player</h1>
      <button class="btn-ghost" id="logout-btn">Lock</button>
    </div>

    <div class="card">
      <div class="file-open-area">
        <button class="btn btn-secondary" id="open-file-btn">Open File</button>
        <span id="file-name">No file selected</span>
        <input type="file" id="file-input" accept="audio/*">
      </div>
    </div>

    <div class="card">
      <div class="card-title" id="track-title">Player</div>
      <div class="track-author" id="track-author" hidden></div>
      <a class="track-source" id="track-source" target="_blank" rel="noopener" hidden></a>
      <p class="no-audio-msg" id="no-audio-msg">Select a file from the library or open a local file</p>

      <div id="player-controls" class="player-hidden">
        <div style="display:flex;flex-direction:column;gap:14px;">
          <div class="waveform-bar">
            <span class="time" id="current-time">0:00</span>
            <input type="range" id="seek" min="0" max="100" value="0" aria-label="Seek">
            <span class="time end" id="duration">0:00</span>
          </div>
          <div class="controls">
            <button class="btn-icon" id="back120"><span class="icon">⏪</span>2min</button>
            <button class="btn-icon" id="back60"><span class="icon">⏪</span>1min</button>
            <button class="btn-icon" id="back30"><span class="icon">⏪</span>30s</button>
            <button class="btn-icon play-pause" id="play-btn">▶</button>
            <button class="btn-icon" id="fwd15">15s<span class="icon">⏩</span></button>
            <button class="btn-icon" id="fwd30">30s<span class="icon">⏩</span></button>
          </div>
          <p class="play-hint" id="play-hint" hidden></p>
          <div class="speed-row">
            <span class="speed-label">Speed</span>
            <div class="speed-pills" id="speed-pills"></div>
          </div>
          <div class="volume-row">
            <span class="volume-icon">🔊</span>
            <input type="range" id="volume" min="0" max="1" step="0.05" value="1" aria-label="Volume">
          </div>
          <div class="bottom-row">
            <button class="btn btn-secondary" id="download-btn">⬇ Download</button>
          </div>
        </div>
      </div>
    </div>

    <div class="shortcuts">
      <div class="shortcut"><kbd>Space</kbd> Play / Pause</div>
      <div class="shortcut"><kbd>←</kbd> −30s</div>
      <div class="shortcut"><kbd>→</kbd> +15s</div>
      <div class="shortcut"><kbd>↑</kbd> Speed +</div>
      <div class="shortcut"><kbd>↓</kbd> Speed −</div>
      <div class="shortcut"><kbd>D</kbd> Download</div>
    </div>

  </div>
  </div>

</div>

<audio id="audio"></audio>

<script>
  'use strict';

  const PASSWORD   = 'kaeru';
  const AUTH_KEY   = 'tts_auth_v1';
  const AUTH_TOKEN = btoa(PASSWORD + '_device_trusted');
  // Served by GitHub Pages as audio/mpeg; GitHub Release downloads (octet-stream) don't play on iOS
  const AUDIO_BASE = 'audio';

  // ── Auth ──────────────────────────────────────────────────
  const loginScreen = document.getElementById('login-screen');
  const appEl       = document.getElementById('app');
  const loginInput  = document.getElementById('login-input');

  function isAuthenticated() {
    return localStorage.getItem(AUTH_KEY) === AUTH_TOKEN;
  }

  function unlock() {
    if (loginInput.value === PASSWORD) {
      localStorage.setItem(AUTH_KEY, AUTH_TOKEN);
      loginScreen.classList.add('hidden');
      appEl.classList.add('visible');
      document.getElementById('login-error').textContent = '';
      init();
    } else {
      document.getElementById('login-error').textContent = 'Incorrect password';
      loginInput.value = '';
      loginInput.focus();
    }
  }

  document.getElementById('login-btn').addEventListener('click', unlock);
  loginInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem(AUTH_KEY);
    location.reload();
  });

  // ── Elements ──────────────────────────────────────────────
  const audio       = document.getElementById('audio');
  const seekEl      = document.getElementById('seek');
  const curTimeEl   = document.getElementById('current-time');
  const durEl       = document.getElementById('duration');
  const playBtn     = document.getElementById('play-btn');
  const volEl       = document.getElementById('volume');
  const speedPills  = document.getElementById('speed-pills');
  const fileInput   = document.getElementById('file-input');
  const fileNameEl  = document.getElementById('file-name');
  const libraryList = document.getElementById('library-list');
  const playHint    = document.getElementById('play-hint');
  const sourceEl    = document.getElementById('track-source');
  const authorEl    = document.getElementById('track-author');

  function setAuthor(name) {
    authorEl.hidden = !name;
    authorEl.textContent = name || '';
  }

  function setSource(url) {
    let host = '';
    try { host = url ? new URL(url).hostname.replace(/^www\./, '') : ''; } catch (_) {}
    sourceEl.hidden = !host;
    if (host) { sourceEl.href = url; sourceEl.textContent = 'Read text: ' + host + ' ↗'; }
  }

  // ── State ─────────────────────────────────────────────────
  const SPEEDS = [0.7, 0.8, 0.9, 1, 1.1, 1.2, 1.3];
  const POS_PREFIX = 'tts_pos:';
  const SPEED_KEY  = 'tts_speed_value';  // stores the rate itself, so editing SPEEDS keeps the choice
  let speedIdx        = SPEEDS.indexOf(1);
  try { const i = SPEEDS.indexOf(parseFloat(localStorage.getItem(SPEED_KEY))); if (i >= 0) speedIdx = i; } catch (_) {}
  let currentBlob     = null;
  let currentFilename = 'audio.mp3';
  let activeLibItem   = null;
  let currentObjectUrl = null;
  let currentUrl       = null;
  let currentKey       = null;  // library filename whose position is tracked (null for local files)
  let lastSaved        = 0;
  let heardSecs        = 0;  // seconds actually played since load (seeks excluded)
  let lastTime         = 0;

  // ── Resume position ───────────────────────────────────────
  function getPos(name) {
    try { return JSON.parse(localStorage.getItem(POS_PREFIX + name)) || null; } catch (_) { return null; }
  }
  function savePos() {
    if (!currentKey || !audio.duration) return;
    try { localStorage.setItem(POS_PREFIX + currentKey, JSON.stringify({ t: audio.currentTime, d: audio.duration })); } catch (_) {}
    lastSaved = Date.now();
  }
  function clearPos() {
    if (currentKey) try { localStorage.removeItem(POS_PREFIX + currentKey); } catch (_) {}
  }

  // ── Init ──────────────────────────────────────────────────
  function init() {
    buildSpeedPills();
    loadLibrary();
    checkUrlParam();
  }

  if (isAuthenticated()) {
    loginScreen.classList.add('hidden');
    appEl.classList.add('visible');
    init();
  } else {
    loginInput.focus();
  }

  // ── Helpers ───────────────────────────────────────────────
  function fmt(s) {
    if (!isFinite(s)) return '0:00';
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(Math.floor(s % 60)).padStart(2, '0');
    return h ? h + ':' + String(m).padStart(2, '0') + ':' + sec : m + ':' + sec;
  }

  function resolveAudioUrl(src) {
    if (src.startsWith('http') || src.startsWith('blob:')) return src;
    return AUDIO_BASE + '/' + encodeURIComponent(src);
  }

  function clearList() {
    while (libraryList.firstChild) libraryList.removeChild(libraryList.firstChild);
  }

  function emptyMsg(text) {
    clearList();
    const li = document.createElement('li');
    li.className = 'library-empty';
    li.textContent = text;
    libraryList.appendChild(li);
  }

  // ── Library ───────────────────────────────────────────────
  document.getElementById('library-refresh-btn').addEventListener('click', loadLibrary);

  // Per-device listening state: finished ("done") and archived files
  const DONE_KEY = 'tts_done', ARCHIVE_KEY = 'tts_archived';
  function getSet(key) {
    try { return new Set(JSON.parse(localStorage.getItem(key)) || []); } catch (_) { return new Set(); }
  }
  function setFlag(key, name, on) {
    const set = getSet(key);
    on ? set.add(name) : set.delete(name);
    try { localStorage.setItem(key, JSON.stringify([...set])); } catch (_) {}
  }

  let libraryItems = [];
  let archiveOpen  = false;

  async function loadLibrary() {
    emptyMsg('Loading…');
    try {
      const res = await fetch('library.json?t=' + Date.now());
      if (!res.ok) throw new Error();
      libraryItems = await res.json();
      renderLibrary();
    } catch (_) {
      emptyMsg('Could not load library');
    }
  }

  function renderLibrary() {
    clearList();
    activeLibItem = null;
    if (!libraryItems.length) { emptyMsg('No files yet'); return; }

    // library.json is kept newest-first by tts-edge.py (parts stay in 1/2/3 order);
    // finished files sink below unfinished ones, archived files go into a collapsed section
    const done = getSet(DONE_KEY), archived = getSet(ARCHIVE_KEY);
    const live = libraryItems.filter(i => !archived.has(i.filename));
    const inArchive = libraryItems.filter(i => archived.has(i.filename));
    live.filter(i => !done.has(i.filename)).forEach(i => libraryList.appendChild(libraryRow(i, false, false)));
    live.filter(i => done.has(i.filename)).forEach(i => libraryList.appendChild(libraryRow(i, true, false)));

    if (inArchive.length) {
      const head = document.createElement('li');
      head.className = 'library-section';
      head.textContent = (archiveOpen ? '▾ ' : '▸ ') + 'Archive (' + inArchive.length + ')';
      head.addEventListener('click', () => { archiveOpen = !archiveOpen; renderLibrary(); });
      libraryList.appendChild(head);
      if (archiveOpen) inArchive.forEach(i => libraryList.appendChild(libraryRow(i, done.has(i.filename), true)));
    }
  }

  function libraryRow(item, isDone, isArchived) {
    const li = document.createElement('li');
    li.className = 'library-item' + (isDone ? ' done' : '');

    const info = document.createElement('div');
    info.className = 'lib-info';

    const titleEl = document.createElement('div');
    titleEl.className = 'lib-title';
    titleEl.textContent = item.title || item.filename;

    const dateEl = document.createElement('div');
    dateEl.className = 'lib-date';
    dateEl.textContent = [item.date, item.author, isDone ? '✓ Played' : ''].filter(Boolean).join(' · ');

    const icon = document.createElement('span');
    icon.className = 'lib-play';
    icon.textContent = '▶';

    const archiveBtn = document.createElement('button');
    archiveBtn.className = 'lib-archive';
    archiveBtn.textContent = isArchived ? 'Restore' : 'Archive';
    archiveBtn.addEventListener('click', e => {
      e.stopPropagation();
      setFlag(ARCHIVE_KEY, item.filename, !isArchived);
      renderLibrary();
    });

    info.appendChild(titleEl);
    info.appendChild(dateEl);
    const pos = getPos(item.filename);
    if (pos && pos.d && !isDone) {
      dateEl.textContent += ' · ' + fmt(pos.t) + ' / ' + fmt(pos.d);
      const bar = document.createElement('div');
      bar.className = 'lib-progress';
      const fill = document.createElement('div');
      fill.style.width = Math.min(100, pos.t / pos.d * 100) + '%';
      bar.appendChild(fill);
      info.appendChild(bar);
    }
    li.appendChild(info);
    li.appendChild(archiveBtn);
    li.appendChild(icon);

    li.addEventListener('click', () => {
      if (isDone) setFlag(DONE_KEY, item.filename, false);
      currentFilename = item.filename;
      currentBlob = null;
      loadAudio(resolveAudioUrl(item.url || item.filename), item.title || item.filename);
      setSource(item.source);
      setAuthor(item.author);
      if (activeLibItem) {
        activeLibItem.el.classList.remove('active');
        activeLibItem.icon.textContent = '▶';
      }
      activeLibItem = { el: li, icon };
      li.classList.add('active');
      icon.textContent = '⏸';
    });

    if (currentKey === item.filename) {
      document.getElementById('track-title').textContent = item.title || item.filename;
      if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: item.title || item.filename });
      setSource(item.source);
      setAuthor(item.author);
      activeLibItem = { el: li, icon };
      li.classList.add('active');
      icon.textContent = audio.paused ? '▶' : '⏸';
    }
    return li;
  }

  // ── URL param ─────────────────────────────────────────────
  function checkUrlParam() {
    const src = new URLSearchParams(location.search).get('src');
    if (!src) return;
    currentFilename = src;
    const title = src.replace(/^.*\//, '').replace(/\.mp3$/i, '').replace(/[_-]/g, ' ');
    loadAudio(resolveAudioUrl(src), title);
  }

  // ── Audio load ────────────────────────────────────────────
  function loadAudio(url, title) {
    if (currentObjectUrl) { URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
    if (url.startsWith('blob:')) currentObjectUrl = url;
    savePos();
    heardSecs = 0;
    lastTime = 0;
    currentKey = currentBlob ? null : currentFilename;
    audio.src = url;
    currentUrl = url;
    document.getElementById('track-title').textContent = title;
    if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title });
    setSource(null);
    setAuthor(null);
    document.getElementById('no-audio-msg').style.display = 'none';
    document.getElementById('player-controls').classList.remove('player-hidden');
    audio.playbackRate = SPEEDS[speedIdx];
    playHint.hidden = true;
    audio.play().then(() => { playBtn.textContent = '⏸'; }).catch(() => {
      playBtn.textContent = '▶';
      playHint.textContent = 'Tap ▶ to play';
      playHint.hidden = false;
    });
  }

  // ── Audio events ──────────────────────────────────────────
  audio.addEventListener('timeupdate', () => {
    const step = audio.currentTime - lastTime;
    if (!audio.paused && step > 0 && step < 2) heardSecs += step;
    lastTime = audio.currentTime;
    if (audio.duration) seekEl.value = (audio.currentTime / audio.duration) * 100;
    curTimeEl.textContent = fmt(audio.currentTime);
    if (Date.now() - lastSaved > 5000) savePos();
  });
  audio.addEventListener('loadedmetadata', () => {
    durEl.textContent = fmt(audio.duration);
    const pos = currentKey ? getPos(currentKey) : null;
    if (pos && pos.t > 10 && pos.t < audio.duration - 10) audio.currentTime = pos.t;
    audio.playbackRate = SPEEDS[speedIdx];
  });
  audio.addEventListener('pause', savePos);
  audio.addEventListener('play', () => { playHint.hidden = true; playBtn.textContent = '⏸'; });
  document.addEventListener('visibilitychange', () => { if (document.hidden) savePos(); });
  window.addEventListener('pagehide', savePos);
  audio.addEventListener('ended', () => {
    playBtn.textContent = '▶';
    // iOS Safari can fire 'ended' when a stream drops (expired release URL, network loss);
    // only count it as finished when playback really reached the end
    const d = audio.duration;
    const finished = isFinite(d) && audio.currentTime >= d - 15 && heardSecs >= Math.min(30, d / 2);
    if (!finished) {
      if (activeLibItem) activeLibItem.icon.textContent = '▶';
      return;
    }
    clearPos();
    if (currentKey) {
      setFlag(DONE_KEY, currentKey, true);
      renderLibrary();
    } else if (activeLibItem) {
      activeLibItem.icon.textContent = '▶';
    }
  });
  seekEl.addEventListener('input', () => {
    if (audio.duration) audio.currentTime = (seekEl.value / 100) * audio.duration;
  });
  volEl.addEventListener('input', () => { audio.volume = volEl.value; });

  // ── Playback ──────────────────────────────────────────────
  function togglePlay() {
    if (!audio.src) return;
    if (audio.paused) {
      audio.play();
      playBtn.textContent = '⏸';
      if (activeLibItem) activeLibItem.icon.textContent = '⏸';
    } else {
      audio.pause();
      playBtn.textContent = '▶';
      if (activeLibItem) activeLibItem.icon.textContent = '▶';
    }
  }

  function seekBy(d) {
    audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + d));
  }

  playBtn.addEventListener('click', togglePlay);
  if ('mediaSession' in navigator) {
    const ms = navigator.mediaSession;
    ms.setActionHandler('play',  () => { if (audio.paused) togglePlay(); });
    ms.setActionHandler('pause', () => { if (!audio.paused) togglePlay(); });
    ms.setActionHandler('seekbackward', () => seekBy(-30));
    ms.setActionHandler('seekforward',  () => seekBy(15));
    try { ms.setActionHandler('seekto', e => { audio.currentTime = e.seekTime; }); } catch (_) {}
  }
  document.getElementById('back120').addEventListener('click', () => seekBy(-120));
  document.getElementById('back60').addEventListener('click',  () => seekBy(-60));
  document.getElementById('back30').addEventListener('click',  () => seekBy(-30));
  document.getElementById('fwd15').addEventListener('click',   () => seekBy(15));
  document.getElementById('fwd30').addEventListener('click',   () => seekBy(30));

  // ── Open local file ───────────────────────────────────────
  document.getElementById('open-file-btn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    currentBlob = file;
    currentFilename = file.name;
    fileNameEl.textContent = file.name;
    activeLibItem = null;
    loadAudio(URL.createObjectURL(file), file.name);
  });

  // ── Speed ─────────────────────────────────────────────────
  function buildSpeedPills() {
    try { localStorage.setItem(SPEED_KEY, String(SPEEDS[speedIdx])); } catch (_) {}
    while (speedPills.firstChild) speedPills.removeChild(speedPills.firstChild);
    SPEEDS.forEach((s, i) => {
      const pill = document.createElement('button');
      pill.className = 'speed-pill' + (i === speedIdx ? ' active' : '');
      pill.textContent = s + 'x';
      pill.addEventListener('click', () => {
        speedIdx = i;
        audio.playbackRate = s;
        buildSpeedPills();
      });
      speedPills.appendChild(pill);
    });
  }

  // ── Download ──────────────────────────────────────────────
  document.getElementById('download-btn').addEventListener('click', () => {
    if (!currentBlob) {
      if (currentUrl) window.open(currentUrl, '_blank');
      return;
    }
    const url = URL.createObjectURL(currentBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = currentFilename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // ── Keyboard ──────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (!isAuthenticated()) return;
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    switch (e.key) {
      case ' ':          e.preventDefault(); togglePlay(); break;
      case 'ArrowLeft':  e.preventDefault(); seekBy(-30); break;
      case 'ArrowRight': e.preventDefault(); seekBy(15); break;
      case 'ArrowUp':    e.preventDefault(); if (speedIdx < SPEEDS.length - 1) { speedIdx++; audio.playbackRate = SPEEDS[speedIdx]; buildSpeedPills(); } break;
      case 'ArrowDown':  e.preventDefault(); if (speedIdx > 0) { speedIdx--; audio.playbackRate = SPEEDS[speedIdx]; buildSpeedPills(); } break;
      case 'd': case 'D': document.getElementById('download-btn').click(); break;
    }
  });
</script>
</body>
</html>
